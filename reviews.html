</head>

<body>
  <div id="wrap">

    <div id="topbar">
      <span class="date">今天是：<span id="today-full"></span></span>
      <div id="toplinks"><a href="#">设为首页</a>|<a href="#">加入收藏</a>|<a href="index.html#contact">联系我们</a></div>
    </div>

    <div id="header">
      <div id="logo">
        <div class="name"><a href="index.html">鲁家滩剧院</a></div>
        <div class="en">Lujiatan Theater</div>
      </div>
    </div>

    <!-- <div id="nav">
      <a href="index.html">网站首页</a>
      <a href="index.html#about">剧院概况</a>

    <div class="crumb"><a href="index.html">首页</a> &raquo; 观众影评</div>

    <div id="main">
      <div id="content">

        <div class="box">
          <div class="hd">观众短评 <span class="more">共 <span id="review-count">0</span> 条</span></div>
          <div class="bd">
            <div class="tabs">
              <a href="#" data-sort="new" class="on">最新</a><a href="#" data-sort="hot">最热</a><a href="#"
                data-sort="worst">最差</a><a href="#" data-sort="best">最佳</a>
            </div>
            <div id="reviews"></div>
            <div class="pager" id="pager"></div>
          </div>
        </div>
      </div>

      <div id="side">
        <div class="box">
          <div class="hd">评分分布</div>
          <div class="bd">
            <table class="info" id="dist">
              <tr>
                <th>力荐 ★★★★★</th>
                <td><i class="bar" data-n="5"></i></td>
              </tr>
              <tr>
                <th>推荐 ★★★★</th>
                <td><i class="bar" data-n="4"></i></td>
              </tr>
              <tr>
                <th>还行 ★★★</th>
                <td><i class="bar" data-n="3"></i></td>
              </tr>
              <tr>
                <th>较差 ★★</th>
                <td><i class="bar" data-n="2"></i></td>
              </tr>
              <tr>
                <th>很差 ★</th>
                <td><i class="bar" data-n="1"></i></td>
              </tr>
            </table>
          </div>
        </div>
        <div class="box">
          <div class="hd">我要写短评</div>
          <div class="bd">
            <p class="gray">短评功能已于 2019 年 11 月 3 日起关闭，暂不恢复。如您需要撤回此前发表的短评，请携带当时的票根前往售票处办理。</p>
            <button disabled>发表短评</button>
          </div>
        </div>
        <!-- <div class="box">
          <div class="hd">最近上映</div>
          <div class="bd">
            <p><span class="redact">██████████</span> <span class="gray small">特别放映</span><br>二楼放映厅 · 9月12日 19:00<br><span
                class="gray">已放映</span>
            </p>
            <a class="btn primary" href="record.html">放映记录</a>
          </div>

      </div>
    </div>

    <div id="footer">
      <p>鲁家滩剧院 北京市门头沟区鲁家滩西街 16 号</p>
      <p>本站最后更新：<span id="today"></span>
    </div>

  </div>
